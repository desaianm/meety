[package]
name = "hypr-capture"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Hyprnote's native macOS microphone and Core Audio process tap, extracted for Meetlocal"

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
cpal = "0.15.3"
dasp = "0.11"
futures-channel = "0.3"
futures-util = "0.3"
ringbuf = "0.4.8"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
