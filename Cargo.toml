[package]
name = "meetlocal"
version = "0.1.0"
edition = "2021"
description = "Offline macOS meeting transcripts with a native menu bar and agent CLI"
license = "GPL-3.0-only"
rust-version = "1.91"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
hound = "3.5"
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
crc32c = "0.6"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
hypr-capture = { path = "vendor/hypr-capture" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures-util = "0.3"
tray-icon = { version = "0.26", default-features = false }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
moonshine-rs = { version = "0.2.6", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = false
strip = false

[workspace]
